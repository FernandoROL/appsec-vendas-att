services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vendas}
      MYSQL_USER: ${MYSQL_USER:-vendas_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT id FROM sales LIMIT 0' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-vendas}
      DB_USER: ${MYSQL_USER:-vendas_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  dados_mysql:
